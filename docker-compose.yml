name: coffee

services:
  db:
    image: mysql:8.0
    container_name: mysql_coffee_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: coffee_db
      MYSQL_USER: coffee_user
      MYSQL_PASSWORD: coffee_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - rede-interna

  backend:
    build: .
    container_name: backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: coffee_db
      DB_USER: coffee_user
      DB_PASSWORD: coffee_password
      JWT_SECRET: supersecret_jwt_key_123456
      CORS_ORIGIN: http://localhost
    depends_on:
      - db
    networks:
      - rede-interna
      - rede-externa

  frontend:
    build: ../frontend
    container_name: frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost
    networks:
      - rede-externa

  # 4. Proxy Reverso Nginx
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    networks:
      - rede-interna
      - rede-externa

networks:
  rede-externa:
    driver: bridge
  rede-interna:
    driver: bridge

volumes:
  db_data:
